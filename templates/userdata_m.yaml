#cloud-config
version: v1
users:
  - name: local
  - name: ${vm_user_name}
    gecos: ${vm_user_displayname}
    passwd: ${vm_user_password}
    groups: sudo
    lock_passwd: false
    shell: /bin/bash
%{ if vm_user_ssh_key != "" ~}
    ssh_authorized_keys:
      - ${vm_user_ssh_key}
%{ endif ~}
apt:
  conf: |
    Acquire {
      Retries "60"
    }
    DPkg {
      Lock {
        Timeout "60"
      }
    }

package_update: false
package_upgrade: false
packages:
  - openssh-server
  - curl
  - ca-certificates
  - python3

write_files:
  - content: |
${hosts_content}
    path: /etc/hosts
    append: true

  - content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
      APT::Periodic::Unattended-Upgrade "0";
    path: /etc/apt/apt.conf.d/10periodic
    permissions: "0644"

  - content: |
      PubkeyAuthentication yes
      PasswordAuthentication yes
    path: /etc/ssh/sshd_config.d/60-k8s-auth.conf
    permissions: "0600"

  - content: |
      [Resolve]
      DNS=${dns_servers}
    path: /etc/systemd/resolved.conf.d/dns.conf
    permissions: "0644"

runcmd:
  - systemctl restart systemd-resolved 2>/dev/null || true
  - systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
  - systemctl disable apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
  - systemctl mask apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
  - apt-get purge --auto-remove -y unattended-upgrades ubuntu-advantage-tools ubuntu-pro-client 2>/dev/null || true
  - rm -f /etc/apt/apt.conf.d/20apt-esm-hook.conf 2>/dev/null || true
  - sed -i 's/^Prompt.*/Prompt=never/' /etc/update-manager/release-upgrades 2>/dev/null || true
  - truncate -s 0 /var/lib/ubuntu-release-upgrader/release-upgrade-available 2>/dev/null || true
  - sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - "[ -e /etc/ssh/sshd_config.d/*.conf ] && grep -ilr PasswordAuthentication /etc/ssh/sshd_config.d/ | xargs -n1 sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' || true"
  - "[ -e /etc/ssh/sshd_config.d/*.conf ] && grep -ilr PubkeyAuthentication /etc/ssh/sshd_config.d/ | xargs -n1 sed -i 's/PubkeyAuthentication no/PubkeyAuthentication yes/' || true"
  - systemctl daemon-reload
  - systemctl restart ssh.service
