            log "growpart $disk $part -> rc=$? $${out:-}"
          elif command -v parted >/dev/null 2>&1; then
            out=$(parted -s "$disk" resizepart "$part" 100% 2>&1)
            log "parted resizepart $disk $part -> rc=$? $${out:-}"
