#cloud-config
ssh_pwauth: true
users:
  - name: ${vm_user_name}
    gecos: ${vm_user_displayname}
    passwd: ${vm_user_password}
    groups: sudo
    lock_passwd: false
    shell: /bin/bash
%{ if vm_user_ssh_key != "" ~}
    ssh_authorized_keys:
      - ${vm_user_ssh_key}
%{ endif ~}
apt:
  conf: |
    Acquire {
      Retries "60"
    }
    DPkg {
      Lock {
        Timeout "60"
      }
    }

package_update: true
package_upgrade: false
packages:
  - openssh-server
  - sshpass
  - git
  - curl
  - ca-certificates
  - jq
  - python3
  - python3-pip
  - software-properties-common
  - ansible
  - netcat-openbsd
  - python3-kubernetes

# This network has no DHCP and every VM is created on a static address, so the
# address has to be applied before cloud-init's network stage can complete and
# before the package stage runs. vCD guest customization is deliberately not
# used: it reboots the guest about a minute after first boot, and that reboot
# cuts cloud-init's apt in the middle of the transaction. cloud-init then skips
# package_update_upgrade_install on the next boot (the module was already marked
# as started), leaving dpkg half-configured and ansible missing.
bootcmd:
  - mkdir -p /etc/netplan
  - 'echo "network: {version: 2, renderer: networkd, ethernets: {${os_nic1_name}: {dhcp4: false, dhcp6: false, addresses: [${node_ip}/${cidr_prefix}], routes: [{to: default, via: ${gateway_ip}}], nameservers: {addresses: ${dns_servers_json}}}}}" > /etc/netplan/01-netplan.yaml'
  - chmod 600 /etc/netplan/01-netplan.yaml
  - rm -f /etc/netplan/50-cloud-init.yaml
  - netplan apply

write_files:
  - path: /etc/hosts
    content: |
${hosts_content}
    append: true

  - path: /etc/apt/apt.conf.d/10periodic
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
      APT::Periodic::Unattended-Upgrade "0";
    permissions: "0644"

  - path: /etc/ssh/sshd_config.d/01-k8s-auth.conf
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      PermitRootLogin no
    permissions: "0600"

  - path: /K8s-inventory
    content: |
${inventory_content}
    permissions: "0600"

  - path: /etc/k8s_cluster_vars.yaml
    content: |
${cluster_vars_content}
    permissions: "0600"

  - path: /ansible_starter.sh
    content: |
      #!/bin/bash
      set -e
      echo "=== [$(date)] Starting Kubernetes Cluster Automation ==="

      cd /${ansible_repo_name}
      mkdir -p vars group_vars/all
      cp /etc/k8s_cluster_vars.yaml vars/cluster_vars.yaml

      # Store vault secret securely on DVM
      echo -n "${vault_secret}" > /root/.vault_pass
      chmod 0600 /root/.vault_pass

      # Encrypt OS credentials into group_vars/all/vault.yaml
      echo "---" > group_vars/all/vault.yaml
      echo -n "${os_admin_username}" | ansible-vault encrypt_string --stdin-name "vault_os_admin" --vault-password-file /root/.vault_pass >> group_vars/all/vault.yaml
      echo "" >> group_vars/all/vault.yaml
      echo -n "${ansible_ssh_pass}" | ansible-vault encrypt_string --stdin-name "vault_os_password" --vault-password-file /root/.vault_pass >> group_vars/all/vault.yaml
      echo "" >> group_vars/all/vault.yaml

      # Move inventory to repository and replace placeholders with encrypted vault variables
      mv /K8s-inventory /${ansible_repo_name}/K8s-inventory
      sed -i 's|__VAULT_OS_ADMIN__|{{ vault_os_admin }}|g; s|__VAULT_OS_PASSWORD__|{{ vault_os_password }}|g' /${ansible_repo_name}/K8s-inventory
      chmod 0600 /${ansible_repo_name}/K8s-inventory group_vars/all/vault.yaml

      if [ -f requirements.yml ]; then
        echo "Installing Galaxy requirements..."
        ansible-galaxy role install -r requirements.yml -p roles/ || true
        ansible-galaxy collection install -r requirements.yml || true
      fi

      echo "=== [$(date)] Waiting for all cluster nodes to be online and accessible via SSH ==="
      CLUSTER_NODES="${cluster_node_ips}"
      for node_ip in $CLUSTER_NODES; do
        echo "Checking port 22 on $node_ip..."
        until nc -z -w 3 "$node_ip" 22 2>/dev/null; do
          echo "Node $node_ip is not listening on port 22 yet, retrying in 5 seconds..."
          sleep 5
        done
        echo "Port 22 on $node_ip is open! Verifying SSH authentication for ${os_admin_username}..."
        until sshpass -p "${ansible_ssh_pass}" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o BatchMode=no "${os_admin_username}@$node_ip" "echo ready" 2>/dev/null | grep -q "ready"; do
          echo "Waiting for successful SSH authentication on $node_ip..."
          sleep 5
        done
        echo "Node $node_ip is FULLY READY and authenticated!"
      done
      echo "=== [$(date)] All cluster nodes are ready and authenticated! Starting Ansible ==="

      echo "Executing Ansible playbook ${ansible_playbook}..."
      ansible-playbook -i /${ansible_repo_name}/K8s-inventory "${ansible_playbook}" -e @vars/cluster_vars.yaml --vault-password-file /root/.vault_pass
      echo "=== [$(date)] Kubernetes Cluster Automation Completed Successfully ==="
    permissions: "0755"

  - path: /usr/local/sbin/vcd-grow-disks.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Grow the root and every LVM-backed data filesystem into the space the disk has.
      #
      # A clone carries the template's partition table: the disk here is 20 GiB while
      # sda3 is 8.29 GiB, so / reports 7.6 GiB and ~11 GiB stay unusable. A later resize
      # only grows the virtual disk (the controller drains, powers off, resizes and
      # powers the worker on again), so the guest has to grow its partition, PV, LV and
      # filesystem at boot - on every boot, because that is when the new space appears.
      #
      # Idempotent: on a disk that already fills its volume group every step is a
      # no-op, and nothing here can shrink anything.
      set -uo pipefail

      LOG=/var/log/vcd-grow-disks.log
      exec >>"$LOG" 2>&1
      log() { echo "[$(date -Is)] $*"; }

      grow_fs() { # lvpath mount fstype
        local lv="$1" mnt="$2" fs="$3" out
        case "$fs" in
          ext2|ext3|ext4)
            out=$(resize2fs "$lv" 2>&1) || { log "resize2fs $lv failed: $out"; return 1; }
            ;;
          xfs)
            out=$(xfs_growfs "$mnt" 2>&1) || { log "xfs_growfs $mnt failed: $out"; return 1; }
            ;;
          *)
            log "filesystem $fs on $mnt is not grown automatically"
            return 0
            ;;
        esac
        log "grew $mnt: $(df -h "$mnt" 2>/dev/null | tail -n1)"
      }

      grow_partition() { # pv, if it is /dev/sdXN
        local pv="$1" disk part out
        if [[ "$pv" =~ ^/dev/([a-z]+)([0-9]+)$ ]]; then
          disk="/dev/${BASH_REMATCH[1]}"
          part="${BASH_REMATCH[2]}"
          if command -v growpart >/dev/null 2>&1; then
            out=$(growpart "$disk" "$part" 2>&1)
            log "growpart $disk $part -> rc=$? ${out:-}"
          elif command -v parted >/dev/null 2>&1; then
            out=$(parted -s "$disk" resizepart "$part" 100% 2>&1)
            log "parted resizepart $disk $part -> rc=$? ${out:-}"
          else
            log "neither growpart nor parted is installed; cannot grow $pv"
            return 0
          fi
          udevadm settle >/dev/null 2>&1 || true
        fi
      }

      grow_lv() { # lvpath mount
        local lv="$1" mnt="$2" vg pv free fs out
        vg=$(lvs --noheadings -o vg_name "$lv" 2>/dev/null | tr -d ' ')
        [[ -z "$vg" ]] && return 0
        pv=$(pvs --noheadings -o pv_name --select "vg_name=$vg" 2>/dev/null | tr -d ' ' | head -n1)
        if [[ -n "$pv" ]]; then
          grow_partition "$pv"
          out=$(pvresize "$pv" 2>&1)
          log "pvresize $pv -> ${out:-ok}"
        fi
        free=$(vgs --noheadings -o vg_free_count "$vg" 2>/dev/null | tr -d ' ')
        if [[ "${free:-0}" -gt 0 ]]; then
          out=$(lvextend -y -l +100%FREE "$lv" 2>&1) || {
            sleep 3
            udevadm settle >/dev/null 2>&1 || true
            out=$(lvextend -y -l +100%FREE "$lv" 2>&1)
          }
          log "lvextend $lv: $out"
        fi
        fs=$(findmnt -n -o FSTYPE "$mnt" 2>/dev/null || true)
        grow_fs "$lv" "$mnt" "${fs:-ext4}" || true
      }

      log "growing filesystems into the space the disks have"
      # every mounted filesystem that lives on a logical volume, the root included
      while read -r tgt src fs; do
        [[ -n "${tgt:-}" && "$src" == /dev/mapper/* ]] || continue
        grow_lv "$src" "$tgt" || log "growth of $tgt failed; continuing"
      done < <(findmnt -lno TARGET,SOURCE,FSTYPE 2>/dev/null)
      log "done"
      exit 0

  - path: /etc/systemd/system/vcd-grow-disks.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Grow the root and data filesystems into the space the disks have
      After=local-fs.target
      StartLimitIntervalSec=0

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/vcd-grow-disks.sh
      RemainAfterExit=yes
      TimeoutStartSec=10min

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/vcd-grow-disks.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Grow the root and every LVM-backed data filesystem into the space the disk has.
