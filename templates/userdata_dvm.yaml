#cloud-config
ssh_pwauth: true
users:
  - name: ${vm_user_name}
    gecos: ${vm_user_displayname}
    passwd: ${vm_user_password}
    groups: sudo
    lock_passwd: false
    shell: /bin/bash
%{ if vm_user_ssh_key != "" ~}
    ssh_authorized_keys:
      - ${vm_user_ssh_key}
%{ endif ~}
apt:
  conf: |
    Acquire {
      Retries "60"
    }
    DPkg {
      Lock {
        Timeout "60"
      }
    }

package_update: true
package_upgrade: false
packages:
  - openssh-server
  - sshpass
  - git
  - curl
  - ca-certificates
  - jq
  - python3
  - python3-pip
  - software-properties-common
  - ansible
  - netcat-openbsd
  - python3-kubernetes

# This network has no DHCP and every VM is created on a static address, so the
# address has to be applied before cloud-init's network stage can complete and
# before the package stage runs. vCD guest customization is deliberately not
# used: it reboots the guest about a minute after first boot, and that reboot
# cuts cloud-init's apt in the middle of the transaction. cloud-init then skips
# package_update_upgrade_install on the next boot (the module was already marked
# as started), leaving dpkg half-configured and ansible missing.
bootcmd:
  - mkdir -p /etc/netplan
  - 'echo "network: {version: 2, renderer: networkd, ethernets: {${os_nic1_name}: {dhcp4: false, dhcp6: false, addresses: [${node_ip}/${cidr_prefix}], routes: [{to: default, via: ${gateway_ip}}], nameservers: {addresses: ${dns_servers_json}}}}}" > /etc/netplan/01-netplan.yaml'
  - chmod 600 /etc/netplan/01-netplan.yaml
  - rm -f /etc/netplan/50-cloud-init.yaml
  - netplan apply

write_files:
  - path: /etc/hosts
    content: |
${hosts_content}
    append: true

  - path: /etc/apt/apt.conf.d/10periodic
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
      APT::Periodic::Unattended-Upgrade "0";
    permissions: "0644"

  - path: /etc/ssh/sshd_config.d/01-k8s-auth.conf
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      PermitRootLogin no
    permissions: "0600"

  - path: /K8s-inventory
    content: |
${inventory_content}
    permissions: "0600"

  - path: /etc/k8s_cluster_vars.yaml
    content: |
${cluster_vars_content}
    permissions: "0600"

  - path: /ansible_starter.sh
    content: |
      #!/bin/bash
      set -e
      echo "=== [$(date)] Starting Kubernetes Cluster Automation ==="

      cd /${ansible_repo_name}
      mkdir -p vars group_vars/all
      cp /etc/k8s_cluster_vars.yaml vars/cluster_vars.yaml

      # Store vault secret securely on DVM
      echo -n "${vault_secret}" > /root/.vault_pass
      chmod 0600 /root/.vault_pass

      # Encrypt OS credentials into group_vars/all/vault.yaml
      echo "---" > group_vars/all/vault.yaml
      echo -n "${os_admin_username}" | ansible-vault encrypt_string --stdin-name "vault_os_admin" --vault-password-file /root/.vault_pass >> group_vars/all/vault.yaml
      echo "" >> group_vars/all/vault.yaml
      echo -n "${ansible_ssh_pass}" | ansible-vault encrypt_string --stdin-name "vault_os_password" --vault-password-file /root/.vault_pass >> group_vars/all/vault.yaml
      echo "" >> group_vars/all/vault.yaml

      # Move inventory to repository and replace placeholders with encrypted vault variables
      mv /K8s-inventory /${ansible_repo_name}/K8s-inventory
      sed -i 's|__VAULT_OS_ADMIN__|{{ vault_os_admin }}|g; s|__VAULT_OS_PASSWORD__|{{ vault_os_password }}|g' /${ansible_repo_name}/K8s-inventory
      chmod 0600 /${ansible_repo_name}/K8s-inventory group_vars/all/vault.yaml

      if [ -f requirements.yml ]; then
        echo "Installing Galaxy requirements..."
        ansible-galaxy role install -r requirements.yml -p roles/ || true
        ansible-galaxy collection install -r requirements.yml || true
      fi

      echo "=== [$(date)] Waiting for all cluster nodes to be online and accessible via SSH ==="
      CLUSTER_NODES="${cluster_node_ips}"
      for node_ip in $CLUSTER_NODES; do
        echo "Checking port 22 on $node_ip..."
        until nc -z -w 3 "$node_ip" 22 2>/dev/null; do
          echo "Node $node_ip is not listening on port 22 yet, retrying in 5 seconds..."
          sleep 5
        done
        echo "Port 22 on $node_ip is open! Verifying SSH authentication for ${os_admin_username}..."
        until sshpass -p "${ansible_ssh_pass}" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o BatchMode=no "${os_admin_username}@$node_ip" "echo ready" 2>/dev/null | grep -q "ready"; do
          echo "Waiting for successful SSH authentication on $node_ip..."
          sleep 5
        done
        echo "Node $node_ip is FULLY READY and authenticated!"
      done
      echo "=== [$(date)] All cluster nodes are ready and authenticated! Starting Ansible ==="

      echo "Executing Ansible playbook ${ansible_playbook}..."
      ansible-playbook -i /${ansible_repo_name}/K8s-inventory "${ansible_playbook}" -e @vars/cluster_vars.yaml --vault-password-file /root/.vault_pass
      echo "=== [$(date)] Kubernetes Cluster Automation Completed Successfully ==="
    permissions: "0755"

runcmd:
  - rm -f /etc/apt/apt.conf.d/20apt-esm-hook.conf 2>/dev/null || true
  - sed -i 's/^Prompt.*/Prompt=never/' /etc/update-manager/release-upgrades 2>/dev/null || true
  - truncate -s 0 /var/lib/ubuntu-release-upgrader/release-upgrade-available 2>/dev/null || true
  - systemctl daemon-reload
  - systemctl restart ssh ssh.socket ssh.service 2>/dev/null || true
  - git clone -b "${ansible_repo_branch}" "${ansible_repo_url}" /${ansible_repo_name}
  - /ansible_starter.sh 2>&1 | tee /var/log/ansible-bootstrap.log
