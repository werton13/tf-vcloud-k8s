      done < <(findmnt -lno TARGET,SOURCE,FSTYPE 2>/dev/null)
      log "done"
      exit 0

  - path: /etc/systemd/system/vcd-grow-disks.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Grow the root and data filesystems into the space the disks have
      After=local-fs.target
      StartLimitIntervalSec=0

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/vcd-grow-disks.sh
      RemainAfterExit=yes
      TimeoutStartSec=10min

      [Install]
      WantedBy=multi-user.target

runcmd:
  - allowed_old=$(grep -i AllowUsers /etc/ssh/sshd_config) && sed -i '$d' /etc/ssh/sshd_config && echo "$allowed_old %{ for ip in ssh_ips ~}${ip} %{ endfor ~}" >> /etc/ssh/sshd_config
  - rm -f /etc/apt/apt.conf.d/20apt-esm-hook.conf 2>/dev/null || true
  - sed -i 's/^Prompt.*/Prompt=never/' /etc/update-manager/release-upgrades 2>/dev/null || true
  - truncate -s 0 /var/lib/ubuntu-release-upgrader/release-upgrade-available 2>/dev/null || true
  - systemctl daemon-reload
  - systemctl restart ssh ssh.socket ssh.service 2>/dev/null || true
  - git clone -b "${ansible_repo_branch}" "${ansible_repo_url}" /${ansible_repo_name}
  - /ansible_starter.sh 2>&1 | tee /var/log/ansible-bootstrap.log
  - systemctl daemon-reload
  - systemctl enable vcd-grow-disks.service
  - systemctl start vcd-grow-disks.service || true
  - systemctl daemon-reload
  - systemctl enable vcd-grow-disks.service
  - systemctl start vcd-grow-disks.service || true
