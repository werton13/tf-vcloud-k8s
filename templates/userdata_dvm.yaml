#cloud-config
version: v1
users:
  - name: local
  - name: ${vm_user_name}
    gecos: ${vm_user_displayname}
    passwd: ${vm_user_password}
    groups: sudo
    lock_passwd: false
    shell: /bin/bash
    ssh_authorized_keys:
      - ${vm_user_ssh_key}

apt:
  conf: |
    Acquire {
      Retries "60"
    }
    DPkg {
      Lock {
        Timeout "60"
      }
    }

package_update: true
package_upgrade: false
packages:
  - openssh-server
  - sshpass
  - git
  - curl
  - ca-certificates
  - jq
  - python3
  - python3-pip
  - software-properties-common
  - ansible

write_files:
  - content: |
${hosts_content}
    path: /etc/hosts
    append: true

  - content: |
${inventory_content}
    path: /K8s-inventory
    permissions: "0600"

  - content: |
${cluster_vars_content}
    path: /etc/k8s_cluster_vars.yaml
    permissions: "0600"

  - content: |
      #!/bin/bash
      set -e
      echo "=== [$(date)] Starting Kubernetes Cluster Automation ==="
      cd /${ansible_repo_name}
      mkdir -p vars group_vars/all
      cp /etc/k8s_cluster_vars.yaml vars/cluster_vars.yaml

      # Store vault secret securely on DVM
      echo -n "${vault_secret}" > /root/.vault_pass
      chmod 0600 /root/.vault_pass

      # Encrypt OS credentials into group_vars/all/vault.yaml
      echo "---" > group_vars/all/vault.yaml
      echo -n "${os_admin_username}" | ansible-vault encrypt_string --stdin-name "vault_os_admin" --vault-password-file /root/.vault_pass >> group_vars/all/vault.yaml
      echo "" >> group_vars/all/vault.yaml
      echo -n "${ansible_ssh_pass}" | ansible-vault encrypt_string --stdin-name "vault_os_password" --vault-password-file /root/.vault_pass >> group_vars/all/vault.yaml
      echo "" >> group_vars/all/vault.yaml

      # Move inventory to repository and replace placeholders with encrypted vault variables
      mv /K8s-inventory /${ansible_repo_name}/K8s-inventory
      sed -i 's|__VAULT_OS_ADMIN__|{{ vault_os_admin }}|g; s|__VAULT_OS_PASSWORD__|{{ vault_os_password }}|g' /${ansible_repo_name}/K8s-inventory
      chmod 0600 /${ansible_repo_name}/K8s-inventory group_vars/all/vault.yaml

      if [ -f requirements.yml ]; then
        echo "Installing Galaxy requirements..."
        ansible-galaxy install -r requirements.yml -p roles/ || true
      fi

      echo "Executing Ansible playbook ${ansible_playbook}..."
      ansible-playbook -i /${ansible_repo_name}/K8s-inventory "${ansible_playbook}" -e @vars/cluster_vars.yaml --vault-password-file /root/.vault_pass
      echo "=== [$(date)] Kubernetes Cluster Automation Completed Successfully ==="
    path: /ansible_starter.sh
    permissions: "0755"

runcmd:
  - systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
  - systemctl disable apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
  - sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - "[ -e /etc/ssh/sshd_config.d/*.conf ] && grep -ilr PasswordAuthentication /etc/ssh/sshd_config.d/ | xargs -n1 sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' || true"
  - "[ -e /etc/ssh/sshd_config.d/*.conf ] && grep -ilr PubkeyAuthentication /etc/ssh/sshd_config.d/ | xargs -n1 sed -i 's/PubkeyAuthentication no/PubkeyAuthentication yes/' || true"
  - systemctl daemon-reload
  - systemctl restart ssh.service
  - apt-get update && apt-get install -y python3-kubernetes || pip3 install kubernetes --break-system-packages || true
  - ansible-galaxy collection install kubernetes.core ansible.posix community.general || true
  - git clone -b "${ansible_repo_branch}" "${ansible_repo_url}" /${ansible_repo_name}
  - /ansible_starter.sh > /var/log/ansible-bootstrap.log 2>&1
