#cloud-config
ssh_pwauth: true
users:
  - name: ${vm_user_name}
    gecos: ${vm_user_displayname}
    passwd: ${vm_user_password}
    groups: sudo
    lock_passwd: false
    shell: /bin/bash
%{ if vm_user_ssh_key != "" ~}
    ssh_authorized_keys:
      - ${vm_user_ssh_key}
%{ endif ~}
apt:
  conf: |
    Acquire {
      Retries "60"
    }
    DPkg {
      Lock {
        Timeout "60"
      }
    }

package_update: false
package_upgrade: false
packages:
  - openssh-server
  - curl
  - ca-certificates
  - python3

write_files:
  - content: |
${hosts_content}
    path: /etc/hosts
    append: true

  - content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
      APT::Periodic::Unattended-Upgrade "0";
    path: /etc/apt/apt.conf.d/10periodic
    permissions: "0644"

  - content: |
      PubkeyAuthentication yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      PermitRootLogin no
    path: /etc/ssh/sshd_config.d/01-k8s-auth.conf
    permissions: "0600"

  - content: |
      network:
        version: 2
        renderer: networkd
        ethernets:
          ${os_nic1_name}:
            dhcp4: false
            dhcp6: false
            addresses:
              - ${node_ip}/${cidr_prefix}
            routes:
              - to: default
                via: ${gateway_ip}
            nameservers:
              addresses: ${dns_servers_json}
    path: /etc/netplan/01-netplan.yaml
    permissions: "0600"

runcmd:
  - apt-get purge --auto-remove -y unattended-upgrades ubuntu-advantage-tools ubuntu-pro-client 2>/dev/null || true
  - rm -f /etc/apt/apt.conf.d/20apt-esm-hook.conf 2>/dev/null || true
  - sed -i 's/^Prompt.*/Prompt=never/' /etc/update-manager/release-upgrades 2>/dev/null || true
  - truncate -s 0 /var/lib/ubuntu-release-upgrader/release-upgrade-available 2>/dev/null || true
  - systemctl daemon-reload
  - systemctl restart ssh ssh.socket ssh.service 2>/dev/null || true